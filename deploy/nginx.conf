server {
    listen 80;
    server_name watchlog.xcorpion.xyz;

    root /home/deploy/watchlog-landing;
    index index.html;

    # /share/movie/123, /share/tv/456, etc. all serve the share page
    location /share/ {
        try_files $uri /share/index.html;
    }

    # apple-app-site-association / assetlinks.json have no extension, so
    # nginx needs to be told the content type explicitly
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
